<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback · Lectiodia</title><style>:root{color-scheme:light dark;--bg:#FAF6EE;--fg:#1B1B1F;--muted:#5C5F66;--line:#E2DCCF;--link:#1F3A5F}
@media (prefers-color-scheme:dark){:root{--bg:#11161D;--fg:#F2EEE6;--muted:#A7ADB6;--line:#2E3947;--link:#D6A840}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}nav{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;margin-bottom:8px}
a{color:var(--link)}table{border-collapse:collapse;width:100%;font-size:15px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}h1{line-height:1.2}</style></head><body><main>
<h1 id="t">Send feedback</h1><p id="m">Opening the feedback form…</p><p id="e"></p>
<script>
// Stable link used by the app ("Send feedback"); forwards to the current form so the form can change without an app update.
var FORM = "", EMAIL = "";
var q = new URLSearchParams(location.search), es = q.get('lang') === 'es', v = q.get('v') || '';
document.documentElement.lang = es ? 'es' : 'en';
document.getElementById('t').textContent = es ? 'Enviar comentarios' : 'Send feedback';
if (FORM) { location.replace(FORM); }
else {
  document.getElementById('m').textContent = es ? 'El formulario estará disponible muy pronto.' : 'The form will be available very soon.';
  if (EMAIL) { var a = document.createElement('a'); a.href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent('Feedback ' + v); a.textContent = EMAIL;
    var p = document.getElementById('e'); p.textContent = es ? 'Mientras tanto, escríbenos a ' : 'Meanwhile, write to '; p.appendChild(a); }
}
</script></main></body></html>
